# Example LiveKit config for a public RK VPS (self-host).
# Copy to livekit.yaml on the edge host and set real keys / domain / TURN secret.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  allow_tcp_fallback: true
redis:
  address: redis:6379
turn:
  enabled: true
  udp_port: 3478
  # tls_port: 5349
  # domain: turn.your-domain.kz
keys:
  mirudevkey: REPLACE_WITH_LONG_SECRET
logging:
  level: info
